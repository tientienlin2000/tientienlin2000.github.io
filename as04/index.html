<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>午後</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f6f4ef;
      color: #2b2b2b;
      font-family: "Noto Serif TC", serif;
    }

    /* 封面：只有標題 */
    .cover {
      height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cover h1 {
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      padding-left: 0.2em;
    }

    /* 條漫：正方形圖片由上往下接在一起，不裁切 */
    .strip {
      max-width: 800px;   /* 電腦上的寬度；手機上會自動滿版 */
      margin: 0 auto;
    }
    .strip img {
      display: block;
      width: 100%;
      height: auto;       /* 保持原本比例，不裁切 */
    }

    .ending { height: 20vh; }
  </style>
</head>
<body>

  <header class="cover">
    <h1>午後</h1>
  </header>

  <main class="strip">
    <img src="images/01.jpg" alt="電風扇吹著，長髮女生站在窗邊撥開頭髮">
    <img src="images/02.jpg" alt="女生打開冰箱往裡面找東西">
    <img src="images/03.jpg" alt="手掌心捧著幾顆冰塊">
    <img src="images/04.jpg" alt="女生把一顆冰塊舉到光下看">
    <img src="images/05.jpg" alt="被風輕輕吹動的窗簾">
    <img src="images/06.jpg" alt="女生低著頭講電話">
  </main>

  <div class="ending"></div>

</body>
</html>
