<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>午後</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f4ef;
      --ink: #2b2b2b;
      --line: #d9d5cc;
      --ice: #8fb8c9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Serif TC", serif;
    }

    /* 上方閱讀進度條 */
    .progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0;
      background: var(--ice);
      z-index: 10;
    }

    /* 封面：只有標題 */
    .cover {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cover h1 {
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      padding-left: 0.2em;
    }
    .cover h1 span { color: var(--ice); }

    /* 每一幕：一張圖，置中 */
    .scene {
      height: 160vh;
      padding: 0 16px;
    }
    .scene img {
      position: sticky;          /* 捲動時圖片固定在畫面中間 */
      top: calc((100vh - min(80vh, 100vw - 32px)) / 2);
      display: block;
      width: min(80vh, 100%);
      margin: 0 auto;
      border: 1px solid var(--line);
      box-shadow: 0 18px 40px rgba(0,0,0,.08);
      background: #fff;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .scene img.show { opacity: 1; }

    .ending { height: 40vh; }
  </style>
</head>
<body>

  <div class="progress" id="progress"></div>

  <header class="cover">
    <h1>午<span>後</span></h1>
  </header>

  <main>
    <section class="scene"><img src="images/01.jpg" alt="電風扇吹著，長髮女生站在窗邊撥開頭髮"></section>
    <section class="scene"><img src="images/02.jpg" alt="女生打開冰箱往裡面找東西"></section>
    <section class="scene"><img src="images/03.jpg" alt="手掌心捧著幾顆冰塊"></section>
    <section class="scene"><img src="images/04.jpg" alt="女生把一顆冰塊舉到光下看"></section>
    <section class="scene"><img src="images/05.jpg" alt="被風輕輕吹動的窗簾"></section>
    <section class="scene"><img src="images/06.jpg" alt="女生低著頭講電話"></section>
  </main>

  <div class="ending"></div>

  <script>
    // 圖片捲動到畫面中時淡入
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('show'); });
    }, { threshold: 0.2 });
    document.querySelectorAll('.scene img').forEach(el => io.observe(el));

    // 上方閱讀進度條
    const bar = document.getElementById('progress');
    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (scrollY / max * 100) + '%';
    });
  </script>
</body>
</html>
